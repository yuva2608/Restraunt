<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRC Cafe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="section__one">
            <h1 class="text1">
                Clasic Rider Cafe
            </h1>
            <h2 class="text2">
                Home Made | Hygenic | Tasty

            </h2>


        </div>
        <div class="section__two">
            <img src="briyani.jpg">
            <h1>
                Dindugal Style Briyani
            </h1>
            <h2>
                Home made & Authentic
            </h2>
            <button type="button" class="button1">Order Now</button>




        </div>

        <div class="section__three">
            <img src="chickenrice.jpg">
            <h1>
                Spicy Chiken Rice
            </h1>
            <h2>
                Spicy chicken & Chineese style
            </h2>
            <button type="button" class="button2">Order Now</button>
        </div>
        <div class="section__four">
            <img src="burger.jpg">
            <h1>
                Classic Burger
            </h1>
            <h2>
                Patty burger & Zingeer Burger
            </h2>
            <button type="button" class="button3">Order Now</button>
        </div>
        <div class="section__five">
            <img src="shawarma.jpg">
            <h1>
                Juice Shawarma
            </h1>
            <h2>
                Roll shawarma & Plate Shawarma
            </h2>
            <button type="button" class="button4">Order Now</button>
        </div>
    </div>
    <div class="section__6">


        <form>
            <h1 class="one">  Contact Us</h1>
            <table>
                <tr>
                    <td>Name:</td>
                    <td>
                        <input type="text" placeholder="Enter Your Name">
                    </td>
                </tr>
                <tr>
                    <td>
                        Age:
                    </td>
                    <td>
                        <input type="number" placeholder="Enter Your Age">
                    </td>
                </tr>
                <tr>
                    <td>Contact Number:</td>
                    <td>
                        <input type="number" placeholder="Enter your Number">
                    </td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td>
                        <input type="email" placeholder="Enter Your Mail">
                    </td>
                </tr>
                <tr>
                    <td>
                        Queries:
                    </td>
                    <td>
                        <textarea placeholder="enter your messsage"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>
                    </td>
                    <td>
                        <button>Send</button>
                    </td>
                </tr>








            </table>





        </form>

    </div>

</body>

</html>
